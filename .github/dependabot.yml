# Security updates only: Dependabot security updates (enabled in the repository settings) open
# pull requests for vulnerable dependencies; routine version updates are switched off.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
