# Local Postgres 18 for development and tests. Dev-only credentials, not secrets.
# Postgres 18 images keep data under /var/lib/postgresql/18/docker, so the volume mounts at
# /var/lib/postgresql (not /var/lib/postgresql/data as with 17 and earlier).
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kabigting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kabigting"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
